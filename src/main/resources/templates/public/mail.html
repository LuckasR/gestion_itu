<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title >Détail de l'offre - ERP Charcuterie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .job-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
        }
        .job-title { font-size: 2.5rem; font-weight: bold; margin-bottom: 10px; }
        .job-department { font-size: 1.3rem; opacity: 0.9; }
        .status-badge { padding: 8px 16px; border-radius: 25px; font-size: 1rem; font-weight: 500; margin-top: 15px; }
        .status-active { background-color: #d4edda; color: #155724; }
        .status-expired { background-color: #f8d7da; color: #721c24; }
        .detail-card { border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .detail-label { font-weight: bold; color: #495057; margin-bottom: 5px; }
        .btn-apply { background: linear-gradient(135deg, #28a745 0%, #20c997 100%); border: none; color: white; border-radius: 25px; padding: 12px 30px; font-weight: 500; font-size: 1.1rem; }
        .btn-apply:hover { color: white; transform: scale(1.05); }
        .expired-badge { background-color: #f8d7da !important; color: #721c24 !important; }
    </style>
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container">
            <a class="navbar-brand" href="/accueil">
                <i class="fas fa-utensils me-2"></i> ERP Charcuterie
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/accueil">Accueil</a>
                <a class="nav-link" href="/offres">Offres d'emploi</a>
                <a class="nav-link" href="/contact">Contact</a>
                <a class="nav-link" href="/mail">mail</a>

                <a class="nav-link" href="/connexion">
                    <i class="fas fa-sign-in-alt me-1"></i> Connexion
                </a>
            </div>
        </div>
    </nav>

        <!-- Header de l'offre -->
        <div class="job-header">
            <div class="container">
                <h1 class="job-title" > Mail </h1>
                    </div>
        </div>

<tr th:each='row : ${contratAsigne}'> 
<td th:text='${row.candidat.annonce.title}'></td> 
<td> 
    <a th:href='@{/contrat/pdf/{id}(id=${row.candidat.id})}'>Voir pdf </a>
</td> 

 
</tr>


            <!-- Informations complémentaires -->
            <div class="col-lg-4">
                <!-- contratAsigne -->
            </div>
        </div>
    </div>

  
</body>
</html>
