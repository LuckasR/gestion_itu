<!DOCTYPE html>
<html xmlns:th='http://www.thymeleaf.org'>
<head><title>Liste</title></head>
<body>
<h2>Liste de jour_ferie</h2>
<a th:href='@{/jour_ferie/create}'>Créer</a>
<table border='1'>
<thead><tr>
<th>id</th>
<th>name</th>
<th>date_ferie</th>
<th>Actions</th>
</tr></thead>
<tbody>
<tr th:each='row : ${jour_feries}'>
<td th:text='${row.id}'></td>
<td th:text='${row.name}'></td>
<td th:text='${row.date_ferie}'></td>
<td>
<a th:href='@{/jour_ferie/edit/{id}(id=${row.id})}'>Edit</a> | <a th:href='@{/jour_ferie/delete/{id}(id=${row.id})}'>Delete</a>
</td></tr>
</tbody></table></body></html>
